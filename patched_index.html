<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <meta name="theme-color" content="#17212e" />
  <title>Manajemen Produksi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">SEMANGAT</div>
    <nav id="nav"></nav>
    <div id="syncBadge" class="sync-badge">Mode penyimpanan lokal</div>
  </aside>
  <main>
    <header class="topbar">
      <div><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
      <div class="top-actions"><input id="searchBox" placeholder="Cari" /><button id="userBtn" class="user-btn hidden" onclick="openAccountMenu()"></button></div><div id="mobileSync" class="mobile-sync">Lokal</div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<input id="excelFile" class="hidden" type="file" accept=".xlsx,.xls,.csv" />
<input id="productImageInput" class="hidden" type="file" accept="image/*" />
<input id="productCameraInput" class="hidden" type="file" accept="image/*" capture="environment" />
<script src="app.js"></script>
</body>
</html>
