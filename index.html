<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NAYESO 국내 관리</title>
  <link rel="stylesheet" href="style.css?v=24.0.0"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<button id="syncBadgeV22" class="sync-badge-v22 syncing" type="button" title="PC·휴대폰 공용 동기화 상태 · 눌러서 지금 동기화">
  <span class="sync-dot-v22" aria-hidden="true"></span>
  <span class="sync-copy-v22"><b id="syncBadgeTextV22">공용 데이터 연결 중…</b><small id="syncBadgeTimeV22">공용 데이터</small></span>
  <span class="sync-refresh-v22" aria-hidden="true">↻</span>
</button>
<div class="app">
  <aside class="sidebar">
    <div class="brand">NAYESO</div>
    <nav id="nav">
      <button data-page="dashboard" class="active">대시보드</button>
      <button data-page="products">제품 DB</button>
      <button data-page="inventory">재고관리</button>
      <button data-page="customers">지점/고객</button>
      <button data-page="invoice">거래명세표</button>
      <button data-page="allocation">출고 정리</button>
      <button data-page="search">통합검색</button>
      <button data-page="settings">설정/백업</button>
    </nav>
    <div class="sync" id="syncState">로컬 데모 모드</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">메인 대시보드</h1>
        <p id="pageSub">제품·재고·거래를 한곳에서 관리합니다.</p>
      </div>
      <div class="top-actions">
        <input id="globalSearch" placeholder="제품 / 고객 / 명세표 검색"/>
        <button id="topNewProductBtn" class="primary hidden" onclick="openProduct()">+ 새 제품</button>
      </div>
    </header>

    <section id="page-dashboard" class="page active"></section>
    <section id="page-products" class="page"></section>
    <section id="page-inventory" class="page"></section>
    <section id="page-customers" class="page"></section>
    <section id="page-invoice" class="page"></section>
    <section id="page-allocation" class="page"></section>
    <section id="page-search" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<input id="excelInput" type="file" accept=".xlsx,.xls,.csv" class="hidden"/>
<input id="imageInput" type="file" accept="image/*" class="hidden"/>
<input id="noteImageInput" type="file" accept="image/*" class="hidden"/>

<script src="app.js?v=24.0.0"></script>
</body>
</html>
